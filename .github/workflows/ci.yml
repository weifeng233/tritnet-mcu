name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A push that supersedes an in-flight run does not need to finish: the newer
# commit is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: format
        run: zig fmt --check build.zig src examples

      # Without modeldata/timestral-5m the three PyTorch-parity tests skip and
      # say so; the other 46 must pass on all three platforms. The parity job
      # below is the one that refuses to skip.
      - name: unit tests
        run: zig build test --summary all

      - name: release build
        run: zig build --release=fast --summary all

  parity:
    name: parity vs PyTorch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The 21 MB checkpoint is not committed; the TRFX fixtures are, so this is
      # the only download the parity tests need.
      - name: fetch the Timestral-5M checkpoint
        run: |
          python -m pip install --upgrade pip
          pip install "huggingface_hub>=0.23"
          python -c "from huggingface_hub import snapshot_download; snapshot_download('mistralai/Timestral-5M', local_dir='modeldata/timestral-5m', allow_patterns=['*.json','*.safetensors','LICENSE'])"

      # -Drequire-parity=true turns a missing checkpoint into a failure. Without
      # it this job would go green having tested nothing, which is the failure
      # mode it exists to prevent.
      - name: parity tests (fail instead of skip)
        run: zig build test --summary all -Drequire-parity=true

  deploy:
    name: C engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: install make
        run: sudo apt-get update && sudo apt-get install -y make

      # Retrain the fast example (13 s) and let the C engine re-derive its
      # numbers from the artifact it just wrote: that is the whole deploy leg.
      # example-ncps takes ~5 minutes, so the NCP artifacts are checked as
      # committed rather than rebuilt here.
      - name: rebuild the CNN artifact
        run: zig build --release=fast example-cnn

      - name: deployment check
        run: make deploy-check
